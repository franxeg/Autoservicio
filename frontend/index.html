<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Autoservicio - Gestión</title>
    <style>
      @media print {
        /* Margen 0 en la página: evita que el navegador dibuje encabezado/pie
           (título, fecha/hora, URL). Si igual aparece, desactivar "Encabezados
           y pies de página" en el diálogo de impresión. */
        @page { margin: 0; }

        html, body {
          margin: 0 !important;
          padding: 0 !important;
          height: auto !important;
          background: white !important;
        }

        /* Ocultar TODO el resto del documento (no reserva espacio) */
        body > * { display: none !important; }

        /* Mostrar solo el ticket */
        .ticket-overlay { display: block !important; position: static !important; background: none !important; inset: auto !important; }
        #ticket-print {
          display: block !important;
          position: static !important;
          width: 100% !important;
          max-height: none !important;
          overflow: visible !important;
          box-shadow: none !important;
          border-radius: 0 !important;
          padding: 12mm !important;
          margin: 0 !important;
          background: white !important;
        }
        .no-print { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
